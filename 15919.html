<html>
	<head>
		<title>15919+</title>
		<script src="15919.js" defer></script>
	</head>
	<body>
		<h1 class="title" id="title"></h1>
		<textarea id="inputText" class="inputText"></textarea>
		<p id="outputText">output.. </p>
		<button id="run" class="run">manual refresh</button>
		<script>
			let idleTimer;
			const delayIdle = 500; //adjust if you want faster or slower refreshes.
			const inputTextBox = document.getElementById('inputText'); 
			const outputText = "outputText";
			const shouldLog = true;
			inputTextBox.addEventListener('input', (e) => {
				clearTimeout(idleTimer);
				idleTimer = setTimeout(() => {
					if (shouldLog) {
						console.log("idle. trying run.");				
					}
					convertText(inputTextBox.value, outputText, shouldLog); // the actual function
				}, delayIdle);
			});
			document.getElementById('run').onclick = () => convertText(inputTextBox.value, outputText, shouldLog); //  manual override

			inputTextBox.addEventListener('keydown', (e) => {  // press enter, auto refreesh
				if (e.key === 'Enter') {
					convertText(inputTextBox.value, outputText);
					if (shouldLog) {
						console.log("new line, auto run ");				
					}
				}
			});

			document.addEventListener('keydown', (e) => {
				if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
				if (document.activeElement.isContentEditable) return;
				const isAlpha = /^[a-zA-z]$/.test(e.key);
				const isEnter = e.key == 'Enter';
				const isSpace = e.key === ' ' || e.code === 'Space';
				if (isAlpha || isEnter) { // auto focus the texbox if you type any letter
					inputTextBox.focus();
					if (isAlpha || isSpace) {
						e.preventDefault(); 
						const pos = inputTextBox.selectionStart ?? inputTextBox.value.length;
						const charToInsert = isSpace ? ' ' : e.key; // space doesnt work in testing
						inputTextBox.value = inputTextBox.value.slice(0, pos) + charToInsert + inputTextBox.value.slice(pos);
						inputTextBox.selectionStart = inputTextBox.selectionEnd = pos + 1;
					}
					inputTextBox.focus();
					if (shouldLog) {
						console.log("new line auto render.");
					}
				}
			});
		</script>
	</body>
</html>
