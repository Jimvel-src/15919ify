<!doctype html>
<html>
	<head>
		<title>15919+</title>
		<script type="module" src="15919.js" defer></script>
		<link rel="stylesheet" href="15919.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=autorenew" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@600&display=swap" rel="stylesheet">	
	</head>
	<body>
		<div id="ribbon">
			<a id="back" href="https://sox.nekoweb.org/projects.html">Back</a>
			<h1 class="title" id="title">15919ify+</h1>
			<a href="https://github.com/Jimvel-src/15919ify/tree/main" id="ver">v1.8.3</a>
			<select id="langdd">
				<option value="malayalam">Malayalam</option>
				<option value="tamil">Tamil</option>
				<option value="kannada">Kannada</option>
				<option value="telugu">Telugu</option>
				<option value="devanagari">Devanagari</option>
				<option value="odia">Odia</option>
				<option value="bangla">Bangla</option>
				<option value="asamiya">Asamiya</option>
				<option value="saurashtra">Saurashtra</option>
				<option value="kaithi">Kaithi</option>

			</select>
			<button id="run" class="run"><span class="material-symbols-outlined">
autorenew
</span></button>

		</div>
		<div id="workspace">
			<div id="in">	<textarea id="inputText" class="inputText"></textarea>	</div>
			<div id="out">	<p id="outputText">output.. </p>	</div>
		</div>
		<script>
			let idleTimer;
			const delayIdle = 500; //adjust if you want faster or slower refreshes.
			const inputTextBox = document.getElementById('inputText'); 
			const outputDOM = "outputText";
			const dd = document.getElementById('langdd');
			const shouldLog = true; // adjust if you want the program to log 
			inputTextBox.addEventListener('input', (e) => {
				clearTimeout(idleTimer);
				idleTimer = setTimeout(() => {
					if (shouldLog) {console.log("idle. trying run.");}
					const lang = dd.value;
					try {
						document.getElementById(outputDOM).innerText = convertText(inputTextBox.value, lang);// the actual function
						if (shouldLog) {console.log("success");}
					}
					catch (error ) {console.error(error);}
				}, delayIdle);
			});
			document.getElementById('run').onclick = () => document.getElementById(outputDOM).innerText = convertText(inputTextBox.value, dd.value);//  manual override

			inputTextBox.addEventListener('keydown', (e) => {  // press enter, auto refreesh
				if (e.key === 'Enter') {
					const lang = dd.value;
					try {
						document.getElementById(outputDOM).innerText = convertText(inputTextBox.value, lang);								    if (shouldLog) {
							console.log("new line run");				
						}
					}
					catch (error){ console.error(error); }
				}
			});

			dd.addEventListener('change', (event) => { // refresh on lang change
				const lang = dd.value;
				try {
					document.getElementById(outputDOM).innerText = convertText(inputTextBox.value, lang);								    if (shouldLog) {
						console.log("lang change run");				
					}
				}
				catch (error){ console.error(error); }
			});

			document.addEventListener('keydown', (e) => {
				if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
				if (document.activeElement.isContentEditable) return;
				const isAlpha = /^[a-zA-z]$/.test(e.key);
				const isEnter = e.key == 'Enter';
				const isSpace = e.key === ' ' || e.code === 'Space';
				const OSKeys = e.ctrlKey;
				if (isAlpha || isEnter && !OSKeys) {
					inputTextBox.focus();
					if (isAlpha || isSpace) {
						e.preventDefault();
						const pos = inputTextBox.selectionStart ?? inputTextBox.value.length;
						const charToInsert = isSpace ? ' ' : e.key;
						inputTextBox.value = inputTextBox.value.slice(0, pos) + charToInsert + inputTextBox.value.slice(pos);
						inputTextBox.selectionStart = inputTextBox.selectionEnd = pos + 1;
					}
					inputTextBox.focus();
					if (shouldLog) {
						console.log("new line auto render.");
					}
				}
			});		
		</script>
	</body>
</html>
